services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: fashionhub-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - fashionhub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fashionhub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - fashionhub-network

  # Optional: Local MongoDB (comment out if using MongoDB Atlas)
  # mongodb:
  #   image: mongo:7
  #   container_name: fashionhub-mongo
  #   restart: unless-stopped
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo-data:/data/db
  #   environment:
  #     - MONGO_INITDB_DATABASE=fashionhub
  #   networks:
  #     - fashionhub-network

volumes:
  mongo-data:

networks:
  fashionhub-network:
    driver: bridge
